<svg xmlns="http://www.w3.org/2000/svg" width="700" height="236" viewBox="0 0 700 236">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f7e9c4"/>
      <stop offset="70%" stop-color="#ecd39d"/>
      <stop offset="100%" stop-color="#d6b273"/>
    </radialGradient>
  </defs>
  <style>
    .pp-wing { transform-box: fill-box; transform-origin: 40% 4%; animation: pp-flap 0.9s ease-in-out infinite alternate; }
    @keyframes pp-flap { from { transform: rotate(0deg); } to { transform: rotate(-14deg); } }
    .pp-eye { transform-box: fill-box; transform-origin: 50% 50%; animation: pp-blink 4.2s infinite; }
    @keyframes pp-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    .pp-jaw { transform-box: fill-box; transform-origin: 95% 8%; animation: pp-talk 2.4s ease-in-out infinite; }
    @keyframes pp-talk { 0%, 40%, 100% { transform: rotate(0deg); } 48%, 64%, 80% { transform: rotate(-22deg); } 56%, 72%, 88% { transform: rotate(0deg); } }
    .pp-body { transform-box: fill-box; transform-origin: 45% 96%; animation: pp-bob 2.4s ease-in-out infinite; }
    @keyframes pp-bob { 0%, 40%, 100% { transform: rotate(0deg); } 52% { transform: rotate(-5deg) translateY(-2px); } 76% { transform: rotate(3deg); } }
    .hop { animation: hop 7s ease-out infinite; }
    @keyframes hop { 0%, 86%, 100% { transform: translateY(0); } 90% { transform: translateY(-14px); } 94% { transform: translateY(0); } 96% { transform: translateY(-5px); } }
  </style>
