name: Sea Serpent

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sea-serpent.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the serpent eating the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sea-serpent.svg?color_snake=#f5c542&color_dots=#0b2a3c,#0e4d64,#137177,#1a9a8c,#5ee1d4
            dist/sea-serpent-dark.svg?color_snake=#f5c542&color_dots=#0d1117,#0e4d64,#137177,#1a9a8c,#5ee1d4

      - name: Push the drawings to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
