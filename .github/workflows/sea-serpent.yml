name: Sea Serpent

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the serpent eating the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sea-serpent.svg?color_snake=#d48a00&color_dots=#e6eef0,#9fd8e0,#4fb3c4,#1d7f99,#0b4a6e
            dist/sea-serpent-dark.svg?color_snake=#f5c542&color_dots=#1c2b36,#0e5f73,#168a9a,#2fbdc4,#7ff0e6

      - name: Push the drawings to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
