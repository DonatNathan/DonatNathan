name: Captain's Log

on:
  schedule:
    - cron: "0 6 * * *" # every morning at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write today's log and bounty poster
        run: python .github/scripts/captains_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/bounty.svg
          git diff --cached --quiet || git commit -m "📜 Captain's Log: $(date -u +%F)"
          git push
