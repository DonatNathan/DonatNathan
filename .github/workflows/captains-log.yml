name: Captain's Log

on:
  schedule:
    - cron: "0 6 * * *" # every morning at 06:00 UTC
  workflow_dispatch:
  issues: # a bottle washed ashore (or was hidden with the "sunk" label)
    types: [opened, edited, labeled, unlabeled, deleted]

permissions:
  contents: write

concurrency:
  group: captains-log
  cancel-in-progress: false

jobs:
  update:
    # Only react to issues that are bottles
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'Message in a bottle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the header, parrot, ledger, recruits and bottles
        run: python .github/scripts/captains_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/recruits assets/parrot.svg assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "📜 Captain's Log: $(date -u +%F)"
          git pull --rebase
          git push
